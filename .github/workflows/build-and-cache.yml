name: Build and cache

# Replaces the old TrueNAS nix-auto-build systemd timer: builds every flake output
# generically (no hand-maintained package list) and pushes to the Attic cache
# (fafnir) over Tailscale. CI is the cache's only writer.
# See docs/adr/0005-nix-cache-moves-to-cluster-ci-builds-all-platforms.md

on:
  push:
    branches: [main]
  schedule:
    # Nightly (~10pm America/New_York): updates flake.lock and the hand-pinned
    # packages in scripts/ai/update_overrides.py first, only commits either if
    # the build below is green. Cron is UTC; 02:17 UTC ~= 10:17pm EDT / 9:17pm
    # EST, off the top-of-hour per GitHub's own scheduling advice. Deliberately
    # early: scheduled runs have been observed starting ~5h late, so this keeps
    # the worst case landing overnight rather than mid-morning.
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      simulate_nightly:
        description: "Run the nightly-only steps (pinned-package update + commit) as if this were the scheduled trigger"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Discover flake outputs
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      pinned-changed: ${{ steps.pinned-updates.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = auto
            cores = 0

      - name: Update flake inputs (nightly only)
        if: github.event_name == 'schedule' || inputs.simulate_nightly == true
        run: nix flake update

      # install-nix-action's bootstrap Nix is whatever version that action
      # currently ships (independent of flake.lock, and drifts over time).
      # Re-exec through the flake's own pinned nixpkgs#nix for every step
      # from here on, so CI evaluates with the exact same Nix version that
      # `nixos-rebuild switch`/`darwin-rebuild switch` use on the hosts
      # (nix.package = pkgs.nix, tied to the same nixpkgs revision).
      - name: Switch to nixpkgs-pinned Nix
        run: |
          nixpkgs_nix=$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#nix)
          echo "$nixpkgs_nix/bin" >> "$GITHUB_PATH"

      # Baseline to fall back to if the pinned-package update below fails
      # partway through (e.g. a transient GitHub API/network error while
      # resolving a hash) - it writes files incrementally, so a failure can
      # leave one mid-edit with a dummy hash still in place. Without this,
      # that failure would fail the whole job and skip `build`/
      # `commit-pinned-updates`, losing the unrelated flake.lock update and
      # the entire cache-build-and-push run for the night, not just the
      # pinned-package bump.
      - name: Snapshot pre-pinned-update diff
        run: git diff > /tmp/pre-pinned-update.patch

      # Bumps talosctl/claude-code to their latest upstream release (neither
      # is a flake input, so `nix flake update` above never touches them).
      # Both ship prebuilt binaries, so this is just a hash prefetch - no
      # build happens here; the build matrix below is what catches a bad bump.
      - name: Update pinned packages (nightly only)
        if: github.event_name == 'schedule' || inputs.simulate_nightly == true
        id: update-pinned
        continue-on-error: true
        run: nix run --inputs-from . nixpkgs#uv -- run scripts/ai/update_overrides.py

      - name: Discard partial pinned-package edits on failure
        if: steps.update-pinned.outcome == 'failure'
        run: |
          echo "::warning::update_overrides.py failed partway through; discarding its partial edits and continuing with just the flake.lock update."
          git checkout -- .
          git apply --allow-empty /tmp/pre-pinned-update.patch

      # Anything the steps above touched (flake.lock and/or the hand-pinned
      # package files) travels to downstream jobs as a single patch, rather
      # than naming specific files here - so a new pinned package doesn't
      # require a matching edit to this workflow.
      - name: Capture pinned-file updates
        id: pinned-updates
        run: |
          git diff > pinned-updates.patch
          if [ -s pinned-updates.patch ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload pinned-file updates for downstream jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pinned-updates
          path: pinned-updates.patch

      - name: Compute build matrix
        id: matrix
        run: |
          set -euo pipefail

          runners='{"x86_64-linux":"ubuntu-latest","aarch64-darwin":"macos-latest"}'

          matrix='[]'

          # packages.<system>.* for every system this flake evaluates
          for system in x86_64-linux aarch64-darwin; do
            runner=$(jq -r --arg s "$system" '.[$s]' <<<"$runners")
            names=$(nix eval --json ".#packages.${system}" --apply builtins.attrNames)
            entries=$(jq -c --arg system "$system" --arg runner "$runner" \
              '[.[] | {kind: "package", system: $system, runner: $runner, name: ., attr: ("packages." + $system + "." + .)}]' \
              <<<"$names")
            matrix=$(jq -c -n --argjson a "$matrix" --argjson b "$entries" '$a + $b')
          done

          # every nixosConfigurations output except "nixos" (not deployed anywhere)
          nixos_systems=$(nix eval --json '.#nixosConfigurations' \
            --apply 'cfgs: builtins.mapAttrs (n: c: c.config.nixpkgs.hostPlatform.system) cfgs')
          entries=$(jq -c --argjson runners "$runners" \
            '[to_entries[] | select(.key != "nixos") | {kind: "nixos", system: .value, runner: $runners[.value], name: .key, attr: ("nixosConfigurations." + .key + ".config.system.build.toplevel")}]' \
            <<<"$nixos_systems")
          matrix=$(jq -c -n --argjson a "$matrix" --argjson b "$entries" '$a + $b')

          # every darwinConfigurations output
          darwin_systems=$(nix eval --json '.#darwinConfigurations' \
            --apply 'cfgs: builtins.mapAttrs (n: c: c.config.nixpkgs.hostPlatform.system) cfgs')
          entries=$(jq -c --argjson runners "$runners" \
            '[to_entries[] | {kind: "darwin", system: .value, runner: $runners[.value], name: .key, attr: ("darwinConfigurations." + .key + ".config.system.build.toplevel")}]' \
            <<<"$darwin_systems")
          matrix=$(jq -c -n --argjson a "$matrix" --argjson b "$entries" '$a + $b')

          # Every host's system must be one of the $runners keys above, or
          # `runs-on` for that matrix entry would silently be `null` -
          # nixosConfigurations/darwinConfigurations aren't restricted to
          # the flake's own `systems` list the way packages.* is, so a new
          # host on an unmapped system wouldn't be caught any other way.
          unmapped=$(jq -c '[.[] | select(.runner == null)]' <<<"$matrix")
          if [ "$unmapped" != "[]" ]; then
            echo "::error::no runner mapping for: $unmapped" >&2
            exit 1
          fi

          echo "matrix={\"include\":$matrix}" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.attr }}
    needs: prepare
    permissions:
      id-token: write # tailscale/github-action exchanges this for a tailnet auth key (workload identity federation, no static OAuth secret)
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    # A fully-cached build finishes in a few minutes (see run history); this
    # is sized for legitimately-slow-but-fine from-source builds (llama-cpp,
    # CUDA), not for a fresh/uncached package quietly compiling for hours
    # (e.g. nodejs running its full upstream test suite from scratch) -
    # that should fail fast instead of burning the whole 6h default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pinned-updates

      - name: Apply pinned-file updates
        run: |
          if [ -s pinned-updates.patch ]; then
            git apply pinned-updates.patch
          fi
          rm -f pinned-updates.patch

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://cache.nixos.org http://attic.warbler-matrix.ts.net:8080/fafnir
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= fafnir:i+z8sCEUusMjfDIEPANiEGrNknaq7ajf8iUwiYwCc8U=
            max-jobs = auto
            cores = 0

      # Ephemeral node, tagged per tailscale/github-action's requirement (a
      # federated identity isn't associated with a tailnet user). "tag:ci"
      # must already exist in the tailnet's ACL policy with access to the
      # Attic instance, and the federated identity trust rule must grant it.
      - name: Join tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci

      # tailscale/github-action's configureDNSOnMacOS unconditionally
      # overwrites the *entire* system resolver (networksetup
      # -setdnsservers) to MagicDNS (100.100.100.100) with no domain
      # scoping, so every lookup - not just *.ts.net - rides on the
      # tailnet's DNS forwarding. That forwarding has been flaky for public
      # hostnames (github.com, tarballs.nixos.org - see run 35510021938),
      # breaking `Build` below when it needs to fetch an un-substitutable
      # source. macOS has no per-domain knob in networksetup, but does
      # support split-DNS natively via /etc/resolver/<domain> (man 5
      # resolver) - so revert to the runner's normal DHCP resolvers for
      # everything, and scope MagicDNS to just the tailnet's own domain
      # (still needed to resolve the Attic cache's tailnet hostname below).
      - name: Un-clobber DNS on macOS (split-DNS scoped to the tailnet)
        if: runner.os == 'macOS'
        run: |
          sudo networksetup -setdnsservers Ethernet Empty
          sudo mkdir -p /etc/resolver
          echo "nameserver 100.100.100.100" | sudo tee /etc/resolver/warbler-matrix.ts.net

      # See the matching step in the `prepare` job for why.
      - name: Switch to nixpkgs-pinned Nix
        run: |
          nixpkgs_nix=$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#nix)
          echo "$nixpkgs_nix/bin" >> "$GITHUB_PATH"

      # Cheap upfront diagnostic: lists exactly which derivations aren't
      # substitutable from any configured cache and would have to be built
      # from scratch - before spending any real time on the build below.
      # This is what would have flagged nodejs-slim-26.9.0 as the blocker in
      # seconds instead of two hours. Raw `nix build --dry-run` output is
      # mostly noise for that purpose: eval-time chatter (copying/unpacking/
      # trace lines from resolving flake inputs) and, when nothing needs
      # building, a paths-to-fetch list that can run into the thousands of
      # lines. Reshape it into: the fetch count/size as one line, a bolded
      # "nothing to build" when fully cached, or the derivation list under a
      # collapsed <details> (still there, just not unfolded by default).
      #
      # The plan also gates the rest of the job: when nothing has to be built,
      # every output is already substitutable from a cache, so `Build` would
      # only download the whole closure to throw it away (--no-link) and
      # there'd be nothing new to push to Attic. Skipping those steps saves
      # that bandwidth (theirs and ours) and still finishes green.
      - name: Show what would be built from source
        id: plan
        run: |
          nix build --dry-run --no-link ".#${{ matrix.attr }}" > /tmp/plan.log 2>&1
          if grep -q 'will be built:$' /tmp/plan.log; then
            echo "needs-build=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs-build=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "### Build plan for \`${{ matrix.attr }}\`"
            echo
            awk '
              /^copying path '"'"'/ { next }
              /^unpacking '"'"'/ { next }
              /^trace: / { next }
              /will be built:$/ {
                header = $0
                sub(/:$/, "", header)
                print "**" header "**"
                print ""
                print "<details><summary>Show derivations</summary>"
                print ""
                print "```"
                state = "building"
                next
              }
              /will be fetched/ {
                if (state == "building") {
                  print "```"
                  print "</details>"
                  print ""
                } else if (state != "fetching") {
                  print "Nothing to build from source."
                  print ""
                }
                print
                state = "fetching"
                next
              }
              state == "building" && /^  / { print; next }
              state == "fetching" && /^  / { next }
              /^[[:space:]]*$/ { next }
              { print }
              END {
                if (state == "building") { print "```"; print "</details>" }
              }
            ' /tmp/plan.log
            if [ "$(grep -c 'will be built:$' /tmp/plan.log)" = 0 ]; then
              echo "**Already fully cached - skipping build and push, nothing to download.**"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # -L/--print-build-logs streams each derivation's build output live
      # instead of staying silent until failure (or success) - so a slow
      # from-source build is visibly making progress rather than looking
      # hung, and its full log is inline here instead of needing a
      # separate `nix log` run against a store path from a finished job.
      # stderr (where -L's substitution/build messages go) is teed to a
      # file so the next step can report where paths actually came from,
      # without losing the live-streamed log in the Actions UI.
      - name: Build
        if: steps.plan.outputs.needs-build == 'true'
        run: |
          nix build -L --no-link --print-out-paths ".#${{ matrix.attr }}" \
            > /tmp/out-paths \
            2> >(tee /tmp/build-stderr.log >&2)

      # Answers "did this just pull from cache.nixos.org (free CDN), from
      # fafnir over the tailnet (homelab's own bandwidth), or actually
      # compile from source?" - fafnir's nix-cache-info advertises Priority
      # 41 vs. cache.nixos.org's 40 (lower wins), so it's only ever hit for
      # paths that aren't mirrored upstream; this just makes that visible
      # instead of it being buried in the full build log. attic push below
      # already dedupes server-side against what fafnir has (including
      # upstream-signed paths), so there's no matching waste on the way back
      # out - see https://docs.attic.rs/tutorial.html.
      - name: Show where paths came from
        if: always() && steps.plan.outputs.needs-build == 'true'
        run: |
          {
            echo "### Fetch/build breakdown for \`${{ matrix.attr }}\`"
            echo
            if [ -s /tmp/build-stderr.log ]; then
              built=$(grep -c "^building '" /tmp/build-stderr.log || true)
              echo "- Built from source: **${built:-0}**"
              grep -oE "copying path '[^']+' from '[^']+'\.\.\.$" /tmp/build-stderr.log \
                | sed -E "s/.*from '([^']+)'\.\.\.\$/\1/" \
                | sed -E 's#^https://cache\.nixos\.org.*#cache.nixos.org (public)#; s#^http://attic\.warbler-matrix\.ts\.net.*#fafnir (homelab)#' \
                | sort | uniq -c | sort -rn \
                | awk '{count=$1; $1=""; sub(/^ /, ""); print "- Fetched from " $0 ": **" count "**"}'
            else
              echo "No build log captured (step above didn't run or produced no output)."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Push to Attic
        if: steps.plan.outputs.needs-build == 'true'
        env:
          ATTIC_ENDPOINT: ${{ vars.ATTIC_ENDPOINT }}
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          nix run --inputs-from . nixpkgs#attic-client -- login ci "$ATTIC_ENDPOINT" "$ATTIC_TOKEN"
          xargs nix run --inputs-from . nixpkgs#attic-client -- push fafnir < /tmp/out-paths

  commit-pinned-updates:
    name: Commit updated flake.lock and pinned packages
    needs: [prepare, build]
    # A job's own `if:` replaces (not adds to) the default implicit
    # "all `needs` succeeded" gate, so that has to be spelled out here too -
    # otherwise a failed build leg (fail-fast: false lets the rest finish)
    # wouldn't stop the commit, defeating the whole point of gating it on
    # green.
    if: success() && (github.event_name == 'schedule' || inputs.simulate_nightly == true) && needs.prepare.outputs.pinned-changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pinned-updates

      - name: Commit and push
        run: |
          git apply pinned-updates.patch
          rm -f pinned-updates.patch

          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "flake.lock, pinned packages: update

          Automated update after a green build in ${{ github.workflow }}."
          git push

  notify-failure:
    name: Alert on nightly failure
    needs: [prepare, build, commit-pinned-updates]
    # `if: always()` so this still runs when an upstream job failed (the
    # default gate would otherwise skip it - the one case this job exists
    # for). Scoped to the nightly path (schedule, or a manual dry run of it
    # via simulate_nightly) same as every other nightly-only step in this
    # file: a push-triggered failure is already visible in the commit/PR
    # status, so paging for it too would just be noise. `needs.*.result`
    # includes jobs skipped by their own `if:` (e.g. commit-pinned-updates
    # when nothing changed), which is why this checks for 'failure'
    # specifically rather than "not success".
    if: always() && (github.event_name == 'schedule' || inputs.simulate_nightly == true) && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      id-token: write # tailscale/github-action exchanges this for a tailnet auth key
    steps:
      - name: Join tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci

      # Posts straight to Alertmanager's v2 API. The `alertmanager`
      # AlertmanagerConfig in the homelab cluster's o11y namespace already
      # default-routes everything to Pushover; `severity: critical` just
      # makes that explicit instead of relying on the fallthrough route.
      # vars.ALERTMANAGER_URL is a tailnet hostname (Alertmanager exposed the
      # same way grafana-service is), stored with a trailing slash to match
      # ATTIC_ENDPOINT's convention - strip it so this doesn't double up
      # with the leading slash below.
      - name: Notify Alertmanager
        env:
          ALERTMANAGER_URL: ${{ vars.ALERTMANAGER_URL }}
        run: |
          curl -sf -X POST "${ALERTMANAGER_URL%/}/api/v2/alerts" \
            -H 'Content-Type: application/json' \
            -d '[{
              "labels": {
                "alertname": "DotNixNightlyCIFailed",
                "severity": "critical",
                "job": "dot.nix-nightly"
              },
              "annotations": {
                "summary": "dot.nix nightly build-and-cache workflow failed",
                "description": "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              }
            }]'
